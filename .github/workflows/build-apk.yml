name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          echo '' | base64 -d > project.tar.gz
          tar -xzf project.tar.gz -C .
          rm -f project.tar.gz
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          else
            SM="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          echo "sdkmanager=$SM"
          test -n "$SM"
          export PATH="$(dirname "$SM"):$ANDROID_HOME/platform-tools:$PATH"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          "$SM" --list_installed | grep -E "android-34|34\.0\.0" || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK back to repo
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ACReader-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ACReader-debug.apk
          git commit -m "ci: publish debug APK [skip ci]" || echo "no change"
          git push origin HEAD:main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: acreader-apk
          path: ACReader-debug.apk
          if-no-files-found: error
